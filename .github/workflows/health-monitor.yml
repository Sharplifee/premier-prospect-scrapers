name: Pipeline Health Monitor

on:
  schedule:
    # 8:00 AM Mountain Time. Two UTC entries cover MST (UTC-7) and MDT (UTC-6);
    # only one fires on any given day. The dedupe check below prevents double-execution.
    - cron: '0 15 * * *'   # 8:00 AM MST
    - cron: '0 14 * * *'   # 8:00 AM MDT
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # required to POST to the workflow dispatches endpoint and re-trigger scraper-cron.yml

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check last scraper run and re-trigger if stale
        env:
          # GITHUB_TOKEN cannot dispatch workflows — GitHub blocks it to prevent
          # recursive triggering, so the dispatch returned 403 and this monitor
          # failed every time it actually tried to do its job (2026-08-06).
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_PAT || secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          # NOT -e: a transient Supabase hiccup on the status query must not
          # abort the health check before it can evaluate or recover.
          set -uo pipefail

          TODAY=$(date -u +%Y-%m-%d)

          # Has the pipeline already run successfully today (any trigger source)?
          LAST_RUN=$(curl -s --max-time 20 \
            "$SUPABASE_URL/rest/v1/pp_run_log?status=eq.success&run_at=gte.${TODAY}T00:00:00Z&order=run_at.desc&limit=1&select=run_at" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            | python3 -c "import sys,json,traceback;d=sys.stdin.read();r=(json.loads(d) if d.strip().startswith('[') else None);print(r[0]['run_at'] if r else ('never' if r==[] else 'unknown'))" 2>/dev/null || echo unknown)

          echo "Last successful pipeline run today: $LAST_RUN"

          if [ "$LAST_RUN" = "unknown" ]; then
            echo "::warning::Could not read pp_run_log (transient). Skipping this check rather than raising a false alarm."
            exit 0
          fi

          if [ "$LAST_RUN" != "never" ]; then
            echo "Pipeline already ran today — health check PASS, no action needed."
            exit 0
          fi

          # Nothing today yet — how long since the last successful run overall?
          LAST_ANY=$(curl -s --max-time 20 \
            "$SUPABASE_URL/rest/v1/pp_run_log?status=eq.success&order=run_at.desc&limit=1&select=run_at" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            | python3 -c "import sys,json,traceback;d=sys.stdin.read();r=(json.loads(d) if d.strip().startswith('[') else None);print(r[0]['run_at'] if r else ('never' if r==[] else 'unknown'))" 2>/dev/null || echo unknown)

          echo "Last successful run overall: $LAST_ANY"

          if [ "$LAST_ANY" = "never" ]; then
            HOURS_AGO=999
          else
            LAST_TS=$(python3 -c "import datetime; print(int(datetime.datetime.fromisoformat('$LAST_ANY'.replace('Z','+00:00')).timestamp()))")
            NOW_TS=$(date +%s)
            HOURS_AGO=$(( (NOW_TS - LAST_TS) / 3600 ))
          fi

          echo "Hours since last successful run: $HOURS_AGO"

          if [ "$HOURS_AGO" -le 28 ]; then
            echo "No run today yet, but last run was only ${HOURS_AGO}h ago — within acceptable window. No action needed."
            exit 0
          fi

          echo "Scraper pipeline stale (${HOURS_AGO}h) — re-triggering scraper-cron.yml"

          DISPATCH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scraper-cron.yml/dispatches" \
            -d '{"ref":"main"}')

          echo "Dispatch response: $DISPATCH_STATUS"

          if [ "$DISPATCH_STATUS" != "204" ]; then
            echo "::warning::Failed to re-trigger scraper-cron.yml (HTTP $DISPATCH_STATUS) — check WORKFLOW_DISPATCH_PAT"
          fi

          if [ -n "${TWILIO_SID:-}" ] && [ -n "${ALERT_TO:-}" ]; then
            curl -sf -X POST "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_SID/Messages.json" \
              --user "$TWILIO_SID:$TWILIO_TOKEN" \
              --data-urlencode "From=$TWILIO_FROM" \
              --data-urlencode "To=$ALERT_TO" \
              --data-urlencode "Body=⚠️ Premier Prospect: scraper stale ${HOURS_AGO}h — auto re-triggered" \
              || echo "::warning::Twilio alert failed to send (non-fatal)"
            # Voice call too: texts from this account are carrier-blocked (A2P/toll-free unapproved, error 30034).
            curl -s -X POST "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_SID/Calls.json" \
              --user "$TWILIO_SID:$TWILIO_TOKEN" --data-urlencode "From=$TWILIO_FROM" --data-urlencode "To=$ALERT_TO" \
              --data-urlencode 'Twiml=<Response><Say voice="Polly.Joanna">Premier Prospect alert. The scrapers are stale and were re-triggered.</Say><Pause length="1"/><Say voice="Polly.Joanna">Premier Prospect alert. The scrapers are stale and were re-triggered.</Say></Response>' > /dev/null || true
          fi


      # Added 2026-09-27: the scrapers kept running green while the nightly
      # Enrichment recompute failed four nights straight, and this monitor
      # never noticed because it only checked the scrape. This step checks the
      # ranked queue itself; if it is stale it re-runs Enrichment, texts an
      # alert, and fails so the problem is visible instead of silent.
      - name: Check ranked queue freshness and re-run Enrichment if stale
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_PAT || secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          set -uo pipefail
          LAST=$(curl -s --max-time 20 \
            "$SUPABASE_URL/rest/v1/pp_entity_conviction?select=computed_at&order=computed_at.desc&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            | python3 -c "import sys,json;d=sys.stdin.read();r=json.loads(d) if d.strip().startswith('[') else None;print(r[0]['computed_at'] if r else 'unknown')" 2>/dev/null || echo unknown)
          # Unreadable once can be a hiccup; unreadable three times over a minute is an outage (Sept 28:
          # the database went down and this step read "unknown" and passed green). Treat that as red.
          for i in 1 2; do
            [ "$LAST" != "unknown" ] && break
            sleep 30
            LAST=$(curl -s --max-time 20 \
              "$SUPABASE_URL/rest/v1/pp_entity_conviction?select=computed_at&order=computed_at.desc&limit=1" \
              -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              | python3 -c "import sys,json;d=sys.stdin.read();r=json.loads(d) if d.strip().startswith('[') else None;print(r[0]['computed_at'] if r else 'unknown')" 2>/dev/null || echo unknown)
          done
          echo "Ranked queue last computed: $LAST"
          if [ "$LAST" = "unknown" ]; then
            echo "::error::Database unreachable on 3 attempts over 60s — Premier Prospect is down."
            if [ -n "${TWILIO_SID:-}" ] && [ -n "${ALERT_TO:-}" ]; then
              curl -sf -X POST "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_SID/Messages.json" \
                --user "$TWILIO_SID:$TWILIO_TOKEN" --data-urlencode "From=$TWILIO_FROM" --data-urlencode "To=$ALERT_TO" \
                --data-urlencode "Body=🔴 Premier Prospect: database unreachable — app, CRM and nightly job are down" \
                || echo "::warning::Twilio alert failed (non-fatal)"
              # Voice call too: texts from this account are carrier-blocked (A2P/toll-free unapproved, error 30034).
              curl -s -X POST "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_SID/Calls.json" \
                --user "$TWILIO_SID:$TWILIO_TOKEN" --data-urlencode "From=$TWILIO_FROM" --data-urlencode "To=$ALERT_TO" \
                --data-urlencode 'Twiml=<Response><Say voice="Polly.Joanna">Premier Prospect alert. The database is unreachable. The app, CRM and nightly job are down.</Say><Pause length="1"/><Say voice="Polly.Joanna">Premier Prospect alert. The database is unreachable. The app, CRM and nightly job are down.</Say></Response>' > /dev/null || true
            fi
            exit 1
          fi
          HOURS=$(( ( $(date +%s) - $(python3 -c "import datetime;print(int(datetime.datetime.fromisoformat('$LAST'.replace('Z','+00:00')).timestamp()))") ) / 3600 ))
          echo "Hours since last recompute: $HOURS"
          if [ "$HOURS" -le 30 ]; then echo "Ranked queue fresh — PASS"; exit 0; fi

          echo "::error::Ranked queue stale (${HOURS}h) — nightly Enrichment is not completing. Re-running it."
          # Only if no Enrichment run is already in flight (it takes up to 85 min).
          BUSY=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/enrich.yml/runs?per_page=5" \
            | python3 -c "import sys,json;print(sum(r['status'] in ('queued','in_progress') for r in json.load(sys.stdin).get('workflow_runs',[])))" 2>/dev/null || echo 0)
          if [ "$BUSY" = "0" ]; then
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/enrich.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "Enrichment dispatch: HTTP $CODE"
          else
            echo "Enrichment already running — not dispatching another."
          fi
          if [ -n "${TWILIO_SID:-}" ] && [ -n "${ALERT_TO:-}" ]; then
            curl -sf -X POST "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_SID/Messages.json" \
              --user "$TWILIO_SID:$TWILIO_TOKEN" --data-urlencode "From=$TWILIO_FROM" --data-urlencode "To=$ALERT_TO" \
              --data-urlencode "Body=⚠️ Premier Prospect: lead ranking stale ${HOURS}h — nightly recompute failing, auto re-run started" \
              || echo "::warning::Twilio alert failed (non-fatal)"
            # Voice call too: texts from this account are carrier-blocked (A2P/toll-free unapproved, error 30034).
            curl -s -X POST "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_SID/Calls.json" \
              --user "$TWILIO_SID:$TWILIO_TOKEN" --data-urlencode "From=$TWILIO_FROM" --data-urlencode "To=$ALERT_TO" \
              --data-urlencode 'Twiml=<Response><Say voice="Polly.Joanna">Premier Prospect alert. Lead ranking is stale. The nightly recompute is failing and a re-run was started.</Say><Pause length="1"/><Say voice="Polly.Joanna">Premier Prospect alert. Lead ranking is stale. The nightly recompute is failing and a re-run was started.</Say></Response>' > /dev/null || true
          fi
          exit 1
