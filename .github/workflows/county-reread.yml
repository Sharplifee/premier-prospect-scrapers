name: County re-read (every parcel held → county-confirmed mailing + current value)
# On demand: re-reads every Salt Lake / Wasatch parcel in pp_parcel_intel from the county, writes only what the county
# confirms today, saves a per-parcel output file as an artifact, then recomputes and runs the integrity gate.
on:
  workflow_dispatch:
    inputs:
      counties: { description: 'counties', default: 'Salt Lake,Wasatch' }
      dry:      { description: '1 = read and report only, write nothing', default: '1' }
      gate_only: { description: '1 = skip the re-read, only run the integrity gate', default: '0' }
concurrency: { group: pp-county-reread, cancel-in-progress: false }
jobs:
  reread:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      COUNTIES: ${{ github.event.inputs.counties || 'Salt Lake,Wasatch' }}
      DRY: ${{ github.event.inputs.dry || '1' }}
      GATE_ONLY: ${{ github.event.inputs.gate_only || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests pdfplumber beautifulsoup4   # the integrity gate parses the county tax PDF
      - name: Re-read every parcel from the county
        if: env.GATE_ONLY != '1'
        run: timeout 100m python scrapers/county_reread.py 2>&1 | tee out_reread.log
      - name: Save job output
        if: always() && env.GATE_ONLY != '1'
        uses: actions/upload-artifact@v4
        with:
          name: county-reread-output
          path: |
            out/county_reread_*.json
            out_reread.log
      - name: Recompute convergence + caches
        if: env.DRY != '1' && env.GATE_ONLY != '1'
        run: |
          H=(-H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" -H "Content-Type: application/json")
          for fn in pp_compute_convergence pp_compute_buyers pp_refresh_app_cache pp_refresh_map_and_perf_bt pp_refresh_kpi_cache; do
            code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST "${H[@]}" "$SUPABASE_URL/rest/v1/rpc/$fn" -d '{}' --max-time 180)
            echo "$fn -> $code $(head -c 40 /tmp/r.txt)"
            [ "$code" -lt 400 ] || { echo "::error::$fn failed"; exit 1; }
          done
      - name: Integrity gate
        if: env.DRY != '1' || env.GATE_ONLY == '1'
        run: python scrapers/integrity_spotcheck.py
