name: County address catch-up (Summit, Wasatch, Salt Lake)
# On demand: owner mailing address, property address and value from each county's own public parcel layer, for every
# Summit / Wasatch / Salt Lake lead that has none. Name-verified matches only. Recomputes and runs the integrity gate.
on:
  workflow_dispatch:
    inputs:
      county_limit: { description: 'leads per county', default: '5000' }
      counties:     { description: 'counties',         default: 'Summit,Wasatch,Salt Lake' }
concurrency: { group: pp-county-backfill, cancel-in-progress: false }
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      COUNTY_LIMIT: ${{ github.event.inputs.county_limit || '5000' }}
      COUNTIES: ${{ github.event.inputs.counties || 'Summit,Wasatch,Salt Lake' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests pdfplumber beautifulsoup4
      - name: County parcel layers → mailing / property address / value
        run: timeout 150m python scrapers/county_parcel_intel.py
      - name: Recompute convergence + caches
        if: always()
        run: |
          H=(-H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" -H "Content-Type: application/json")
          for fn in pp_compute_convergence pp_compute_buyers pp_refresh_app_cache pp_refresh_map_and_perf_bt pp_refresh_kpi_cache; do
            code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST "${H[@]}" "$SUPABASE_URL/rest/v1/rpc/$fn" -d '{}' --max-time 180)
            echo "$fn -> $code $(head -c 40 /tmp/r.txt)"
            [ "$code" -lt 400 ] || { echo "::error::$fn failed"; exit 1; }
          done
      - name: Integrity gate
        run: python scrapers/integrity_spotcheck.py
