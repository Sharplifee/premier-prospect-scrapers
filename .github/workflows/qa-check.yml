name: QA check (site + app, permanent QA device)
# Nov 21 2026: browser and app checks run here, signed in as the one permanent QA device (pp_qa_device), so they never
# leave a throwaway pp_agents row behind. The anon key below is the public key the site itself ships.
on:
  workflow_dispatch:
    inputs:
      leads: { description: 'Comma-separated entity keys (blank = top 3 reachable)', required: false, default: '' }
concurrency: { group: pp-qa-device, cancel-in-progress: false }   # one user of the QA session at a time (token rotates)
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxidmFvc3lmaWtrcHZjd2tzaXBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMDg0MDksImV4cCI6MjA5MDU4NDQwOX0.Gh9whjmUPz4rdKYr5yo8ZHS0nSNpkQUOwdIladX6mG4
      LEADS: ${{ github.event.inputs.leads }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests playwright && python -m playwright install --with-deps chromium
      - run: python scrapers/qa_check.py
