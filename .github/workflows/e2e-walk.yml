name: End-to-end lead walk (web CRM, permanent QA device)
# Nov 24 2026: walks one top-tier lead through call log, note, appointment and deal in the live CRM as the QA device,
# then deletes what it wrote by id and restores the lead exactly (scrapers/e2e_walk.py).
on:
  workflow_dispatch:
    inputs:
      lead: { description: 'Entity key (blank = an untouched top-tier reachable lead)', required: false, default: '' }
concurrency: { group: pp-qa-device, cancel-in-progress: false }   # one user of the QA session at a time (token rotates)
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxidmFvc3lmaWtrcHZjd2tzaXBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMDg0MDksImV4cCI6MjA5MDU4NDQwOX0.Gh9whjmUPz4rdKYr5yo8ZHS0nSNpkQUOwdIladX6mG4
      LEAD: ${{ github.event.inputs.lead }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests playwright && python -m playwright install --with-deps chromium
      - run: cd scrapers && python e2e_walk.py
