name: Parcel catch-up (Utah County)
# One-off / on-demand catch-up: fetch assessed value + mailing address for EVERY Utah County lead whose parcel
# is not yet in pp_parcel_intel (the nightly step only covers the top 300 owners, 80 parcels a run).
# Highest-conviction leads first. Recomputes the queue and runs the integrity gate at the end.
on:
  workflow_dispatch:
    inputs:
      parcel_limit: { description: 'parcels to fetch this run', default: '2400' }
      doc_limit: { description: 'stored recorder documents to give a proven parcel first (0 = skip)', default: '600' }

# Own group: sharing pp-enrich let the next scheduled enrichment replace this run while it waited (GitHub keeps one pending run per group).
concurrency: { group: pp-parcel-backfill, cancel-in-progress: false }

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PARCEL_OWNERS: '20000'
      PARCEL_LIMIT: ${{ github.event.inputs.parcel_limit || '2400' }}
      BUYER_LIMIT: '0'
      DIVORCE_LIMIT: '0'
      OBIT_LIMIT: '0'
      NAME_LIMIT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests pdfplumber beautifulsoup4
      - name: Proven parcels for stored recorder documents (county document pages)
        if: ${{ (github.event.inputs.doc_limit || '600') != '0' }}
        env: { DOC_LIMIT: "${{ github.event.inputs.doc_limit || '600' }}" }
        run: timeout 40m python scrapers/utah_doc_backfill.py || echo "::warning::document-page parcel step ended early"
      - name: Assessor parcel intel for every Utah County lead
        run: timeout 130m python scrapers/parcel_intel.py
      - name: Recompute convergence + caches
        if: always()
        run: |
          # Nov 21 2026: one recompute at a time (lease) with lock/timeout retries — see scrapers/pp_recompute.sh
          bash scrapers/pp_recompute.sh
      - name: Integrity gate
        run: python scrapers/integrity_spotcheck.py
